<title>BILL-ÉCOLE – Gestion d'école privée</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2540;--muted:#6b7694;--line:#e4e8f2;--pri:#1f4fd8;--pri2:#e8eefc;--ok:#12a060;--warn:#e89b0c;--bad:#d9342b;--side:#14203f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:#cfd8f5;padding:18px 12px;position:fixed;top:0;bottom:0;overflow:auto;z-index:20;transition:transform .2s}
aside h1{font-size:17px;color:#fff;margin:0 8px 4px}
aside small{display:block;margin:0 8px 18px;color:#8e9bc4;font-size:11px}
aside a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;color:#cfd8f5;text-decoration:none;cursor:pointer;margin-bottom:2px}
aside a:hover{background:#1f2f5c}
aside a.on{background:var(--pri);color:#fff}
main{margin-left:230px;flex:1;padding:22px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px;flex:1}
#menu{display:none;border:0;background:var(--pri);color:#fff;border-radius:8px;padding:8px 12px;font-size:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font-size:22px;margin-top:4px}
.kpi span{color:var(--muted);font-size:12px}
.two{grid-template-columns:2fr 1fr}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.red{background:#fde8e6;color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;width:100%}
.bar input,.bar select{width:auto;min-width:160px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.tag.ok{background:#e0f6ec;color:var(--ok)}.tag.warn{background:#fff2d9;color:#b06f00}.tag.bad{background:#fde8e6;color:var(--bad)}
.act{display:flex;gap:5px;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(15,23,50,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
.box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.box.wide{max-width:760px}
.box h3{margin:0 0 12px}
.box label{display:block;margin-bottom:10px;font-size:12px;color:var(--muted);font-weight:600}
.box label input,.box label select{margin-top:4px;color:var(--ink);font-weight:400}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.chart div{flex:1;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.prog{height:7px;background:var(--line);border-radius:9px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:26px}
.seg button{border:1px solid var(--line);background:#fff;padding:5px 10px;cursor:pointer;font-size:12px}
.seg button.p.on{background:var(--ok);color:#fff}.seg button.a.on{background:var(--bad);color:#fff}.seg button.r.on{background:var(--warn);color:#fff}
.seg button:first-child{border-radius:7px 0 0 7px}.seg button:last-child{border-radius:0 7px 7px 0}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:14px}#menu{display:block}.two{grid-template-columns:1fr}}
.bpv{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:#fff;font-size:13px;color:#111}
.bpv .hd{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
.bpv h1{margin:0;font-size:19px}.bpv .sig{display:flex;justify-content:space-between;margin-top:40px}
.bpv table{margin:10px 0}.bpv th,.bpv td{border:1px solid #999;padding:5px 8px;color:#111;font-size:12px}.bpv th{background:#eee}
.lvl{margin:20px 0 6px;font-size:15px;color:var(--pri)}.lvl small{color:var(--muted);font-weight:400}
</style>
</head>
<body>
<div id="app">
<aside id="side"></aside>
<main>
  <div class="top"><button id="menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><h2 id="title"></h2><div id="topact"></div><button id="inst" class="btn ghost" style="display:none" onclick="installApp()">📲 Installer l'application</button></div>
  <div id="view"></div>
</main>
</div>
<div id="modal"></div>

const stu=id=>S.students.find(s=>s.id===id);

const due=s=>Math.max(0,(cls(s.classId)?.fee||0)-(+s.remise||0));

function pickPhoto(inp,k){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const sz=220,c=document.createElement('canvas');c.width=c.height=sz;
    const m=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,sz,sz);
    const u=c.toDataURL('image/jpeg',.72);
    document.getElementById('ph_'+k).value=u;
    document.getElementById('pv_'+k).innerHTML=`<img src="${u}" style="width:72px;height:72px;border-radius:50%;object-fit:cover">`;
  };im.src=r.result};
  r.readAsDataURL(f);
}

function vDash(){

  S.payments.forEach(p=>{const m=p.date.slice(0,7);months[m]=(months[m]||0)+p.amount});
  const keys=Object.keys(months).sort().slice(-6),max=Math.max(1,...keys.map(k=>months[k]));

   <div class="card"><b>Encaissements par mois</b>${keys.length?`<div class="chart">${keys.map(k=>`<div><small>${fmt(months[k]).replace(' '+S.settings.currency,'')}</small><i style="height:${Math.max(3,months[k]/max*120)}px"></i>${k.slice(5)}/${k.slice(2,4)}</div>`).join('')}</div>`:'<div class="empty">Aucun paiement enregistré</div>'}</div>

function vCompta(){
  document.getElementById('topact').innerHTML='<button class="btn" onclick="formExp()">+ Dépense</button>';
  document.getElementById('view').innerHTML=`<div class="bar"><input type="month" id="cm" onchange="fillCompta()"><button class="btn ghost" onclick="document.getElementById('cm').value='';fillCompta()">Toute l'année</button><button class="btn ghost" onclick="exportCompta()">Export CSV</button></div><div id="cbody"></div>`;
  fillCompta();

function ledger(m){
  const r=S.payments.filter(p=>!m||p.date.startsWith(m)).map(p=>({date:p.date,kind:'in',cat:p.type,label:fullname(stu(p.studentId))+' – '+p.ref,amount:p.amount}));
  const d=S.expenses.filter(e=>!m||e.date.startsWith(m)).map(e=>({id:e.id,date:e.date,kind:'out',cat:e.category,label:e.label,amount:e.amount}));
  const b=S.deposits.filter(x=>!m||x.date.startsWith(m)).map(x=>({date:x.date,kind:'bank',cat:'Dépôt en banque',label:x.bank+(x.ref?' – bordereau '+x.ref:''),amount:x.amount}));
  return r.concat(d,b).sort((a,b)=>b.date.localeCompare(a.date));
}
function fillCompta(){
  const m=document.getElementById('cm').value,L=ledger(m);
  const rin=sum(L.filter(x=>x.kind==='in').map(x=>x.amount)),rout=sum(L.filter(x=>x.kind==='out').map(x=>x.amount)),rbk=sum(L.filter(x=>x.kind==='bank').map(x=>x.amount));
  const byCat={};L.filter(x=>x.kind==='out').forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.amount);
  document.getElementById('cbody').innerHTML=`<div class="grid kpis"><div class="card kpi"><span>Recettes</span><b style="color:var(--ok)">${fmt(rin)}</b></div><div class="card kpi"><span>Dépenses</span><b style="color:var(--bad)">${fmt(rout)}</b></div><div class="card kpi"><span>Résultat</span><b>${fmt(rin-rout)}</b></div><div class="card kpi"><span>Déposé en banque</span><b style="color:var(--pri)">${fmt(rbk)}</b></div><div class="card kpi"><span>Solde de caisse</span><b>${fmt(rin-rout-rbk)}</b></div></div>
  <div class="grid two"><div class="card tw"><b>Journal</b>${L.length?`<table><tr><th>Date</th><th>Catégorie</th><th>Libellé</th><th>Entrée</th><th>Sortie</th><th></th></tr>${L.map(x=>`<tr><td>${fdate(x.date)}</td><td>${esc(x.cat)}</td><td>${esc(x.label)}</td><td style="color:var(--ok)">${x.kind==='in'?fmt(x.amount):''}</td><td style="color:${x.kind==='bank'?'var(--pri)':'var(--bad)'}">${x.kind!=='in'?fmt(x.amount):''}</td><td>${x.id?`<button class="btn sm red" onclick="delExp('${x.id}')">×</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">Aucune écriture</div>'}</div>
  <div class="card"><b>Dépenses par catégorie</b><table>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${fmt(v)}</td></tr>`).join('')||'<tr><td class="empty">—</td></tr>'}</table></div></div>`;
}

    {k:'amount',l:'Montant ('+S.settings.currency+')',t:'number',r:1},{k:'date',l:'Date',t:'date',d:today()}

/* ============ BANQUE (dépôts d'argent) ============ */
const BANKS=['BICIGUI','Ecobank','Société Générale Guinée','Vista Bank','Afriland First Bank','UBA','Orabank','BNG','Banque Islamique de Guinée'];
function cashBalance(){return sum(S.payments.map(p=>p.amount))-sum(S.expenses.map(e=>e.amount))-sum(S.deposits.map(d=>d.amount))}
function vBanque(){
  document.getElementById('topact').innerHTML='<button class="btn" onclick="formDeposit()">+ Dépôt en banque</button>';
  const L=S.deposits.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  const mo=today().slice(0,7),tot=sum(L.map(d=>d.amount)),mm=sum(L.filter(d=>d.date.startsWith(mo)).map(d=>d.amount));
  const byBank={};L.forEach(d=>byBank[d.bank]=(byBank[d.bank]||0)+d.amount);
  document.getElementById('view').innerHTML=`<div class="grid kpis"><div class="card kpi"><span>Solde de caisse (à déposer)</span><b>${fmt(cashBalance())}</b></div><div class="card kpi"><span>Total déposé en banque</span><b style="color:var(--pri)">${fmt(tot)}</b></div><div class="card kpi"><span>Déposé ce mois</span><b>${fmt(mm)}</b></div></div>
  <div class="grid two"><div class="card tw"><b>Dépôts</b>${L.length?`<table><tr><th>Date</th><th>Banque</th><th>N° bordereau</th><th>Montant</th><th>Déposé par</th><th></th></tr>${L.map(d=>`<tr><td>${fdate(d.date)}</td><td>${esc(d.bank)}${d.note?'<br><small style="color:var(--muted)">'+esc(d.note)+'</small>':''}</td><td>${esc(d.ref||'—')}</td><td><b>${fmt(d.amount)}</b></td><td>${esc(d.by||'')}</td><td><div class="act"><button class="btn sm ghost" onclick="printDeposit('${d.id}')">Bordereau</button><button class="btn sm red" onclick="delDeposit('${d.id}')">×</button></div></td></tr>`).join('')}</table>`:'<div class="empty">Aucun dépôt enregistré</div>'}</div>
  <div class="card"><b>Total par banque</b><table>${Object.entries(byBank).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${fmt(v)}</td></tr>`).join('')||'<tr><td class="empty">—</td></tr>'}</table></div></div>`;
}
function formDeposit(){
  const banks=Array.from(new Set(S.deposits.map(d=>d.bank).concat(BANKS)));
  modal(`<h3>Dépôt d'argent en banque</h3><p style="color:var(--muted);margin-top:-6px">Solde de caisse actuel : <b>${fmt(cashBalance())}</b></p><form id="fd"><label>Banque<input name="bank" list="banks" required placeholder="Choisir ou saisir une banque"><datalist id="banks">${banks.map(b=>`<option value="${esc(b)}">`).join('')}</datalist></label><label>Montant déposé (${esc(S.settings.currency)})<input name="amount" type="number" min="1" step="any" required></label><label>N° du bordereau de versement<input name="ref"></label><label>Date<input name="date" type="date" value="${today()}" required></label><label>Note (facultatif)<input name="note"></label><div class="row"><button type="button" class="btn ghost" onclick="closeM()">Annuler</button><button class="btn">Enregistrer</button></div></form>`);
  document.getElementById('fd').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),a=+f.get('amount');
    if(a>cashBalance()&&!confirm("Ce montant dépasse le solde de caisse ("+fmt(cashBalance())+"). Enregistrer quand même ?"))return;
    S.deposits.push({id:uid(),bank:f.get('bank').trim(),amount:a,ref:f.get('ref').trim(),date:f.get('date'),note:f.get('note').trim(),by:(typeof ME!=='undefined'&&ME&&ME.name)||''});
    closeM();save();render()};
}
function delDeposit(id){if(confirm('Supprimer ce dépôt ?')){S.deposits=S.deposits.filter(d=>d.id!==id);save();render()}}
function printDeposit(id){

}

const LEVELS=['Maternelle','Primaire','Collège','Lycée'];
const LEVEL_ICON={Maternelle:'🧸',Primaire:'🎒',Collège:'📘',Lycée:'🎓',Autres:'📁'};
const levelOf=c=>c&&LEVELS.includes(c.level)?c.level:'Autres';
const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'fr',{numeric:true});
const myClasses=()=>role()==='professeur'?S.classes.filter(c=>(ME.classIds||[]).includes(c.id)):S.classes;
const mineStudent=s=>role()!=='professeur'||(ME.classIds||[]).includes(s.classId);
function classOptions(list){return LEVELS.concat(['Autres']).map(l=>{const cs=list.filter(c=>levelOf(c)===l).sort(byName);return cs.length?`<optgroup label="${l}">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</optgroup>`:''}).join('')}

function fillNotes(){

/* ============ BULLETINS ============ */
const f2=n=>(n===null||n===undefined)?'—':(Math.round(n*100)/100).toFixed(2);
const r100=a=>Math.round(a*100);
function calcStudent(sid,term){
  let tot=0,coef=0;const rows=S.settings.subjects.map(sj=>{const n=S.grades[sid+'|'+term+'|'+sj.n];if(n!==undefined){tot+=n*sj.c;coef+=sj.c}return{sj,n}});
  return{rows,avg:coef?tot/coef:null,tot,coef};
}
function ranking(classId,term){
  const l=S.students.filter(s=>s.classId===classId&&s.status!=='Sorti').map(s=>({s,avg:calcStudent(s.id,term).avg}));
  const ranked=l.filter(x=>x.avg!==null).sort((a,b)=>b.avg-a.avg||fullname(a.s).localeCompare(fullname(b.s),'fr'));
  ranked.forEach(x=>{const k=r100(x.avg);x.rank=ranked.findIndex(y=>r100(y.avg)===k)+1;x.ex=ranked.filter(y=>r100(y.avg)===k).length>1});
  return{all:l,n:ranked.length,ranked};
}
const rk=x=>x&&x.rank?(x.rank===1?'1er':x.rank+'e')+(x.ex?' ex':''):'—';
const appr=a=>a>=16?'Excellent':a>=14?'Très bien':a>=12?'Bien':a>=10?'Passable':'Insuffisant';
function classStats(classId,term){
  const ids=S.students.filter(s=>s.classId===classId&&s.status!=='Sorti').map(s=>s.id);
  return S.settings.subjects.map(sj=>{
    const notes=ids.map(i=>S.grades[i+'|'+term+'|'+sj.n]).filter(v=>v!==undefined);
    return{notes,avg:notes.length?sum(notes)/notes.length:null,min:notes.length?Math.min(...notes):null,max:notes.length?Math.max(...notes):null};
  });
}
const sortedByRank=R=>R.all.slice().sort((a,b)=>(a.rank||9999)-(b.rank||9999)||fullname(a.s).localeCompare(fullname(b.s),'fr'));
function curBull(){return{c:document.getElementById('bc').value,t:document.getElementById('bt').value}}

  if(!myClasses().length){noClass();return}
  document.getElementById('view').innerHTML=`<div class="card"><div class="bar">${classSelect('bc','fillBull()')}${termSelect('bt','fillBull()')}<select id="bv" onchange="fillBull()"><option value="d">Affichage : notes détaillées</option><option value="c">Affichage : classement (rang, matricule, élève, moyenne, appréciation)</option></select><button class="btn" onclick="showAllBull()">👁 Voir tous les bulletins</button><button class="btn ghost" onclick="printAllBull()">🖨️ Imprimer tous les bulletins</button><button class="btn ghost" onclick="printClassement()">🖨️ Imprimer le classement</button><button class="btn ghost" onclick="printRecap()">🖨️ Imprimer le tableau des notes et rangs</button></div><div class="tw" id="btbl"></div></div>`;

/* tableau récapitulatif de la classe : notes par matière, moyenne, rang */
function recapHTML(classId,t,withBtn){
  const R=ranking(classId,t),subs=S.settings.subjects,st=classStats(classId,t);

  const head=`<tr><th>Rang</th><th>Matricule</th><th>Élève</th>${subs.map(x=>`<th style="text-align:center">${esc(x.n)}<br><small style="font-weight:400">coef ${x.c}</small></th>`).join('')}<th style="text-align:center">Moyenne /20</th><th>Appréciation</th>${withBtn?'<th></th>':''}</tr>`;

    return `<tr><td><b>${rk(x)}</b></td><td>${esc(x.s.matricule||'—')}</td><td>${esc(fullname(x.s))}</td>${c.rows.map(r=>`<td style="text-align:center">${r.n===undefined?'—':r.n}</td>`).join('')}<td style="text-align:center"><b>${f2(x.avg)}</b></td><td>${x.avg===null?'':appr(x.avg)}</td>${withBtn?`<td><button class="btn sm ghost" onclick="printBull('${x.s.id}','${t}')">Bulletin</button></td>`:''}</tr>`}).join('');
  const foot=`<tr style="background:#f1f3f9"><td colspan="3"><b>Moyenne de la classe</b></td>${st.map(a=>`<td style="text-align:center"><b>${f2(a.avg)}</b></td>`).join('')}<td style="text-align:center"><b>${f2(cavg)}</b></td><td></td>${withBtn?'<td></td>':''}</tr>

function bullHTML(sid,t,last){
  const s=stu(sid),c=calcStudent(sid,t),R=ranking(s.classId,t),me=R.all.find(x=>x.s.id===sid),st=classStats(s.classId,t);

let ME=null,db=null,auth=null,READY=false,BUSY=false,UNSUBS=[],LAST={},PENDING=new Set(),RT=null;
const ROLE_LABEL={direction:'Direction',comptable:'Comptable',caissier:'Caissier',professeur:'Professeur'};

const role=()=>ME?ME.role:'direction';

const visiblePages=()=>PAGES.filter(p=>pageOK(p[0]));

function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14203f;color:#fff;padding:11px 18px;border-radius:10px;z-index:99;font-size:13px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4500)}
function friendly(e){const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'E-mail ou mot de passe incorrect.';
  if(c==='auth/too-many-requests')return 'Trop de tentatives. Patientez quelques minutes puis réessayez.';
  if(c==='auth/network-request-failed')return 'Pas de connexion Internet.';
  if(c==='auth/invalid-email')return "Adresse e-mail invalide.";
  if(c==='auth/email-already-in-use')return 'Cette adresse e-mail est déjà utilisée.';
  if(c==='auth/weak-password')return 'Mot de passe trop court (6 caractères minimum).';
  if(c==='auth/operation-not-allowed')return "La connexion par e-mail n'est pas activée dans Firebase (Authentication > Sign-in method).";
  if(c==='permission-denied')return "Accès refusé. Vérifiez que les règles de sécurité Firestore ont été publiées.";
  return (e&&e.message)||'Erreur inconnue.';}

/* --- écran de connexion --- */
function authBox(inner,msg){const a=document.getElementById('auth');a.style.display='flex';a.innerHTML=`<div class="box" style="max-width:400px"><div style="text-align:center;margin-bottom:12px">${logoImg(76)}<h3 style="margin:8px 0 0">${esc(S.settings.name)}</h3><small style="color:var(--muted)">Gestion d'école privée</small></div>${msg?`<div style="background:#fde8e6;color:var(--bad);padding:9px 12px;border-radius:8px;margin-bottom:10px;font-size:13px">${esc(msg)}</div>`:''}${inner}</div>`}
function showAuth(msg,email){
  authBox(`<form onsubmit="doLogin(event)"><label>Adresse e-mail<input name="email" type="email" required autocomplete="username" value="${esc(email||'')}"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label><div class="row" style="justify-content:stretch"><button class="btn" style="width:100%">Se connecter</button></div></form>
  <p style="text-align:center;margin:12px 0 0;font-size:13px"><a href="#" onclick="doReset();return false">Mot de passe oublié ?</a> · <a href="#" onclick="showSetup();return false">Première configuration</a></p>`,msg);
}
function showSetup(msg){
  authBox(`<p style="color:var(--muted);font-size:13px;margin-top:0">À faire <b>une seule fois</b> : création du compte <b>Direction</b>, qui pourra ensuite ajouter les comptables et les professeurs.</p><form onsubmit="doSetup(event)"><label>Votre nom<input name="name" required></label><label>Adresse e-mail<input name="email" type="email" required></label><label>Mot de passe (6 caractères minimum)<input name="password" type="password" minlength="6" required></label><label>Confirmer le mot de passe<input name="p2" type="password" minlength="6" required></label><div class="row"><button type="button" class="btn ghost" onclick="showAuth()">Retour</button><button class="btn">Créer le compte Direction</button></div></form>`,msg);
}
function hideAuth(){const a=document.getElementById('auth');a.style.display='none';a.innerHTML=''}
async function doLogin(e){e.preventDefault();const f=new FormData(e.target),em=f.get('email').trim();try{await auth.signInWithEmailAndPassword(em,f.get('password'))}catch(x){showAuth(friendly(x),em)}}
async function doReset(){const em=prompt('Entrez votre adresse e-mail pour recevoir le lien de réinitialisation :');if(!em)return;try{await auth.sendPasswordResetEmail(em.trim());alert('E-mail envoyé. Vérifiez votre boîte de réception (et les courriers indésirables).')}catch(x){alert(friendly(x))}}
async function doSetup(e){
  e.preventDefault();const f=new FormData(e.target);
  if(f.get('password')!==f.get('p2')){showSetup('Les deux mots de passe sont différents.');return}
  BUSY=true;let cred=null;
  try{
    cred=await auth.createUserWithEmailAndPassword(f.get('email').trim(),f.get('password'));
    const b=db.batch();
    b.set(db.doc('users/'+cred.user.uid),{name:f.get('name').trim(),email:f.get('email').trim(),role:'direction'});
    b.set(db.doc('meta/bootstrap'),{by:cred.user.uid,at:Date.now()});
    await b.commit();
    BUSY=false;onUser(auth.currentUser);
  }catch(x){
    BUSY=false;
    if(cred){try{await cred.user.delete()}catch(_){try{await auth.signOut()}catch(__){}}}
    showSetup(x.code==='permission-denied'?"La première configuration a déjà été faite. Retournez à l'écran de connexion.":friendly(x));
  }
}

/* --- démarrage et suivi de la connexion --- */
function initCloud(){
  if(!window.firebase){showAuth("Impossible de charger le service en ligne (Internet ?). Rechargez la page.");return}
  firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth.onAuthStateChanged(onUser);
  addEventListener('online',()=>{if(ME)render()});addEventListener('offline',()=>{if(ME)render()});
}
function stopListeners(){UNSUBS.forEach(u=>{try{u()}catch(e){}});UNSUBS=[]}
async function onUser(u){
  if(BUSY)return;
  stopListeners();ME=null;READY=false;LAST={};S=defaults();
  if(!u){page='dashboard';showAuth();return}
  try{
    const d=await db.doc('users/'+u.uid).get();
    if(!d.exists){await auth.signOut();showAuth("Ce compte n'a pas encore de rôle. Demandez à la direction de l'ajouter.");return}
    ME=Object.assign({uid:u.uid,email:u.email},d.data());
  }catch(e){await auth.signOut().catch(()=>{});showAuth(friendly(e));return}
  hideAuth();page=defaultPage();startListeners();render();
}
function startListeners(){
  const cols=ROLE_READ[ME.role]||[],docs=['meta/settings'].concat(ME.role==='professeur'?[]:['meta/counters']);
  PENDING=new Set(cols.concat(docs));
  const isP=ME.role==='professeur',ids=(ME.classIds||[]).slice(0,30);
  cols.forEach(c=>{
    let ref=db.collection(c);
    if(isP&&c!=='classes'){
      if(!ids.length){onCol(c,{forEach:()=>{}});return}
      ref=ref.where(c==='students'?'classId':'c','in',ids);
    }
    UNSUBS.push(ref.onSnapshot(s=>onCol(c,s),e=>onErr(c,e)));
  });
  docs.forEach(p=>UNSUBS.push(db.doc(p).onSnapshot(s=>onDoc(p,s),e=>onErr(p,e))));
}
function onErr(p,e){console.error(p,e);toast('Lecture impossible ('+p+') : '+friendly(e))}
function mergeArr(arr,items){
  const byId=new Map(arr.map(o=>[o.id,o])),ids=new Set(items.map(o=>o.id));
  for(let i=arr.length-1;i>=0;i--)if(!ids.has(arr[i].id))arr.splice(i,1);
  items.forEach(n=>{const o=byId.get(n.id);if(o){Object.keys(o).forEach(k=>{if(!(k in n))delete o[k]});Object.assign(o,n)}else arr.push(n)});
}
const SORTS={students:(a,b)=>String(a.matricule||'').localeCompare(String(b.matricule||'')),teachers:(a,b)=>String(a.matricule||a.nom||'').localeCompare(String(b.matricule||b.nom||'')),classes:(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'fr',{numeric:true}),payments:(a,b)=>String(a.ref||'').localeCompare(String(b.ref||'')),expenses:(a,b)=>String(a.date||'').localeCompare(String(b.date||''))};
function onCol(c,snap){
  const docs=[];snap.forEach(d=>docs.push({id:d.id,data:d.data()}));
  Object.keys(LAST).forEach(k=>{if(k.startsWith(c+'/'))delete LAST[k]});
  docs.forEach(d=>LAST[c+'/'+d.id]=stable(d.data));
  if(c==='grades'){const g={};docs.forEach(d=>{const m=d.data.g||{};Object.keys(m).forEach(k=>g[d.id+'|'+k]=m[k])});S.grades=g}
  else if(c==='att'){const a={};docs.forEach(d=>{const x=d.data;a[x.d+'|'+x.c]=x.r});S.att=a}
  else{mergeArr(S[c],docs.map(d=>d.data));if(SORTS[c])S[c].sort(SORTS[c])}
  synced(c);
}
function onDoc(p,snap){
  if(snap.exists){const d=snap.data();LAST[p]=stable(d);
    if(p==='meta/settings'&&d.settings){Object.keys(S.settings).forEach(k=>{if(!(k in d.settings))delete S.settings[k]});Object.assign(S.settings,d.settings)}
    if(p==='meta/counters'){['counter','mat','tmat'].forEach(k=>S[k]=Math.max(S[k]||0,d[k]||0))}
  }else delete LAST[p];
  synced(p);
}
function synced(k){
  if(!READY){PENDING.delete(k);if(PENDING.size)return;READY=true;afterReady()}
  scheduleRender();
}
function scheduleRender(){clearTimeout(RT);RT=setTimeout(()=>{const a=document.activeElement;if(a&&a.closest&&a.closest('#view')&&/INPUT|SELECT/.test(a.tagName)&&!document.getElementById('modal').classList.contains('on')){scheduleRender();return}render()},250)}
function afterReady(){
  const empty=!S.classes.length&&!S.students.length&&!S.teachers.length&&!LAST['meta/settings'];
  const has=LEGACY.students.length||LEGACY.classes.length||LEGACY.teachers.length;
  let done=false;try{done=localStorage.getItem('ecolegest_imported')}catch(e){}
  if(role()==='direction'&&!empty)cloudPush();
  if(role()==='direction'&&empty&&has&&!done&&confirm("Des données existent déjà sur cet appareil ("+LEGACY.students.length+" élèves, "+LEGACY.teachers.length+" professeurs).\n\nVoulez-vous les envoyer en ligne pour les partager avec les autres appareils ?"))importLegacy(true);
}
function importLegacy(skipConfirm){
  if(!skipConfirm&&!confirm("Remplacer les données en ligne par celles de cet appareil ? Les données en ligne actuelles seront effacées."))return;
  ['classes','students','teachers','payments','expenses','deposits'].forEach(c=>{S[c].length=0;(LEGACY[c]||[]).forEach(o=>S[c].push(o))});
  S.grades=Object.assign({},LEGACY.grades);S.att=Object.assign({},LEGACY.att);
  Object.assign(S.settings,LEGACY.settings);if(S.settings.name==='Mon École Privée')S.settings.name='BILL-ÉCOLE';
  ['counter','mat','tmat'].forEach(k=>S[k]=LEGACY[k]||0);
  try{localStorage.setItem('ecolegest_imported','1')}catch(e){}
  cloudPush();render();toast('Données envoyées en ligne.');
}

/* --- envoi des modifications (seulement ce qui a changé) --- */
function cloudItems(){
  const m={};
  ['classes','students','teachers','payments','expenses','deposits'].forEach(c=>(S[c]||[]).forEach(o=>m[c+'/'+o.id]=o));
  const g={};Object.keys(S.grades).forEach(k=>{const i=k.indexOf('|');(g[k.slice(0,i)]=g[k.slice(0,i)]||{})[k.slice(i+1)]=S.grades[k]});
  Object.keys(g).forEach(sid=>m['grades/'+sid]={g:g[sid],c:(stu(sid)||{}).classId||''});
  Object.keys(S.att).forEach(k=>{const [d,c]=k.split('|');m['att/'+d+'_'+c]={d:d,c:c,r:S.att[k]}});
  m['meta/settings']={settings:S.settings};
  m['meta/counters']={counter:S.counter||0,mat:S.mat||0,tmat:S.tmat||0};
  return m;
}
function allowedWrite(p){const w=ROLE_WRITE[role()];return !w||w.some(x=>p===x||p.startsWith(x+'/'))}
function cloudPush(){
  if(!ME||!READY)return;
  const m=cloudItems(),ops=[];
  Object.keys(m).forEach(p=>{if(!allowedWrite(p))return;const js=stable(m[p]);if(LAST[p]!==js){ops.push(['s',p,JSON.parse(js)]);LAST[p]=js}});
  Object.keys(LAST).forEach(p=>{if(!(p in m)&&allowedWrite(p)){ops.push(['d',p]);delete LAST[p]}});
  for(let i=0;i<ops.length;i+=400){
    const b=db.batch();ops.slice(i,i+400).forEach(o=>o[0]==='s'?b.set(db.doc(o[1]),o[2]):b.delete(db.doc(o[1])));
    b.commit().catch(e=>{console.error(e);toast(e.code==='permission-denied'?"Action non autorisée pour votre rôle : la modification a été annulée.":'Enregistrement impossible : '+friendly(e))});
  }
}

/* --- gestion des utilisateurs (Direction) --- */
async function vUsers(){
  document.getElementById('topact').innerHTML='<button class="btn" onclick="formUser()">+ Nouvel utilisateur</button>';
  const v=document.getElementById('view');v.innerHTML='<div class="card empty">Chargement…</div>';
  try{
    const snap=await db.collection('users').get(),rows=[];snap.forEach(d=>rows.push(Object.assign({id:d.id},d.data())));
    if(page!=='users')return;
    v.innerHTML=`<div class="card tw"><table><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th>Classes attribuées</th><th></th></tr>${rows.map(u=>`<tr><td><b>${esc(u.name||'')}</b></td><td>${esc(u.email||'')}</td><td><span class="tag ${u.role==='direction'?'ok':'warn'}">${esc(ROLE_LABEL[u.role]||u.role)}</span></td><td>${u.role==='professeur'?((u.classIds||[]).map(i=>esc(cls(i)?.name||'?')).join(', ')||'<span style="color:var(--bad)">Aucune</span>')+` <button class="btn sm ghost" onclick="editClasses('${u.id}')">Classes</button>`:'—'}</td><td>${u.id===ME.uid?'<small style="color:var(--muted)">(vous)</small>':`<div class="act"><button class="btn sm ghost" onclick="chgRole('${u.id}','${esc(u.role)}')">Changer le rôle</button><button class="btn sm red" onclick="rmUser('${u.id}')">Retirer l'accès</button></div>`}</td></tr>`).join('')}</table></div>
    <div class="card" style="margin-top:14px;font-size:13px;color:var(--muted)"><b style="color:var(--ink)">Rôles</b><br><b>Direction</b> : tout.<br><b>Comptable</b> : élèves, paiements, comptabilité, banque (lecture), salaires, bulletins (lecture).<br><b>Caissier</b> : comptabilité, encaissements, paiements (dépenses et salaires) et dépôts en banque. Il ne modifie pas les élèves.<br><b>Professeur</b> : élèves (sans les montants), notes, présences, bulletins.</div>`;
  }catch(e){v.innerHTML='<div class="card empty">Erreur : '+esc(friendly(e))+'</div>'}
}
function formUser(){
  modal(`<h3>Nouvel utilisateur</h3><form onsubmit="saveUser(event)"><label>Nom complet<input name="name" required></label><label>Adresse e-mail<input name="email" type="email" required></label><label>Mot de passe provisoire (6 caractères min.)<input name="password" type="text" minlength="6" required></label><label>Rôle<select name="role" onchange="document.getElementById('ucl').style.display=this.value==='professeur'?'block':'none'"><option value="professeur">Professeur</option><option value="comptable">Comptable</option><option value="caissier">Caissier</option><option value="direction">Direction</option></select></label><div id="ucl"><b style="font-size:12px;color:var(--muted)">Classes attribuées au professeur</b>${classChecks([])}</div><div class="row"><button type="button" class="btn ghost" onclick="closeM()">Annuler</button><button class="btn">Créer le compte</button></div></form>`);
}
async function saveUser(e){
  e.preventDefault();const f=new FormData(e.target),d={name:f.get('name').trim(),email:f.get('email').trim(),password:f.get('password'),role:f.get('role'),classIds:f.get('role')==='professeur'?f.getAll('classIds'):[]};
  const btn=e.target.querySelector('.btn:not(.ghost)');btn.disabled=true;btn.textContent='Création…';
  const app2=firebase.initializeApp(CFG,'sec'+Date.now());
  try{
    const cred=await app2.auth().createUserWithEmailAndPassword(d.email,d.password);
    await db.doc('users/'+cred.user.uid).set({name:d.name,email:d.email,role:d.role,classIds:d.classIds});
    await app2.auth().signOut();closeM();toast('Compte créé. Transmettez-lui son e-mail et son mot de passe provisoire.');vUsers();
  }catch(x){btn.disabled=false;btn.textContent='Créer le compte';alert(friendly(x))}
  finally{try{await app2.delete()}catch(_){}}
}
function classChecks(sel){
  if(!S.classes.length)return '<p style="color:var(--muted);font-size:13px">Créez d\'abord des classes.</p>';
  return LEVELS.concat(['Autres']).map(l=>{const cs=S.classes.filter(c=>levelOf(c)===l).sort(byName);return cs.length?`<div style="margin:6px 0 2px;font-size:12px;color:var(--pri)"><b>${LEVEL_ICON[l]} ${l}</b></div>`+cs.map(c=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);margin:2px 0"><input type="checkbox" name="classIds" value="${c.id}" ${sel.includes(c.id)?'checked':''} style="width:auto;margin:0">${esc(c.name)}</label>`).join(''):''}).join('');
}
async function editClasses(id){
  let u;try{u=(await db.doc('users/'+id).get()).data()}catch(x){alert(friendly(x));return}
  modal(`<h3>Classes de ${esc(u.name||'')}</h3><p style="color:var(--muted);margin-top:-6px;font-size:13px">Le professeur ne verra et ne modifiera que ces classes.</p><form id="fcl">${classChecks(u.classIds||[])}<div class="row"><button type="button" class="btn ghost" onclick="closeM()">Annuler</button><button class="btn">Enregistrer</button></div></form>`);
  document.getElementById('fcl').onsubmit=async e=>{e.preventDefault();try{await db.doc('users/'+id).update({classIds:new FormData(e.target).getAll('classIds')});closeM();toast('Classes enregistrées. Le professeur doit se reconnecter.');vUsers()}catch(x){alert(friendly(x))}};
}
async function chgRole(id,cur){const r=prompt('Nouveau rôle (direction, comptable, caissier ou professeur) :',cur);if(!r||!ROLE_LABEL[r.trim()])return;try{await db.doc('users/'+id).update({role:r.trim()});vUsers()}catch(x){alert(friendly(x))}}
async function rmUser(id){if(!confirm("Retirer l'accès de cet utilisateur ? Il ne pourra plus ouvrir les données."))return;try{await db.doc('users/'+id).delete();vUsers()}catch(x){alert(friendly(x))}}

/* ============ INSTALLATION (PWA) ============ */
let _dip=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function showInst(){const b=document.getElementById('inst');if(b)b.style.display=(isStandalone()?'none':'inline-block')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_dip=e;showInst()});
window.addEventListener('appinstalled',()=>{_dip=null;showInst()});
async function installApp(){
  if(_dip){_dip.prompt();await _dip.userChoice;_dip=null;showInst();return}
  const ua=navigator.userAgent,rows=[];
  const ok=(b,t)=>rows.push((b?'✅ ':'❌ ')+t);
  ok(location.protocol==='https:'||location.hostname==='localhost','Adresse sécurisée (https)');
  let sw=false;try{sw=!!(await navigator.serviceWorker.getRegistration())}catch(e){}
  ok(sw,'Service worker actif (mode hors-ligne)');
  let mf=false;try{mf=(await fetch('manifest.json',{cache:'no-store'})).ok}catch(e){}
  ok(mf,'Fichier manifest.json trouvé');
  let ic=false;try{ic=(await fetch('icon-512.png',{cache:'no-store'})).ok}catch(e){}
  ok(ic,'Icônes trouvées');
  const inApp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|MicroMessenger|; wv\)|GSA\//i.test(ua);
  const ff=/Firefox/i.test(ua)&&!/Android/i.test(ua)&&!isIOS();
  const iosNotSafari=isIOS()&&/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
  let tip='Votre navigateur n\'a pas proposé l\'installation automatique. Utilisez le menu du navigateur :';
  let how='<b>Ordinateur (Chrome / Edge) :</b> icône d\'installation à droite de la barre d\'adresse, ou menu ⋮ → « Installer BILL-ÉCOLE » / « Applications → Installer ce site comme application ».<br><b>Android (Chrome) :</b> menu ⋮ → « Installer l\'application » ou « Ajouter à l\'écran d\'accueil ».';
  if(isStandalone()){tip='L\'application est déjà installée et ouverte en mode application.';how=''}
  else if(isIOS()){how='<b>iPhone / iPad :</b> ouvrez cette page dans <b>Safari</b>, touchez <b>Partager</b> (carré avec flèche) puis <b>« Sur l\'écran d\'accueil »</b>.'+(iosNotSafari?'<br><b>Vous n\'êtes pas dans Safari : copiez l\'adresse et ouvrez-la dans Safari.</b>':'')}
  else if(inApp){tip='⚠️ Vous êtes dans un navigateur intégré (WhatsApp, Facebook…). L\'installation y est impossible.';how='Copiez l\'adresse du site et ouvrez-la dans <b>Chrome</b> (Android / ordinateur) ou <b>Edge</b>.'}
  else if(ff){tip='⚠️ Firefox sur ordinateur ne permet pas d\'installer les applications web.';how='Ouvrez le site dans <b>Chrome</b> ou <b>Edge</b>.'}
  modal(`<h3>Installer l'application</h3><p style="margin-top:0">${tip}</p><p>${how}</p><p style="font-size:13px;color:var(--muted);line-height:1.7"><b>Vérifications :</b><br>${rows.join('<br>')}</p><p style="font-size:12px;color:var(--muted)">Si déjà installée : cherchez « BILL-ÉCOLE » dans vos applications, ou désinstallez-la puis réessayez. Si vous avez refusé l\'installation plusieurs fois, Chrome peut attendre quelques jours : utilisez alors le menu ⋮.</p><div class="row"><button class="btn" onclick="closeM()">OK</button></div>`);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const had=!!navigator.serviceWorker.controller;let rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
}
showInst();
if(CLOUD)initCloud();else render();
</script>
